# GitHub Actions: runs automatically on every push to main and on every pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- Job 1: Java backend ----------
  backend:
    name: Backend (build, test, SonarQube)
    runs-on: ubuntu-latest            # GitHub lends us a fresh Linux computer

    # A throwaway PostgreSQL just for this run (our tests need a database)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shopsphere
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # These override application.properties, only inside the robot
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shopsphere
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: shopsphere

    defaults:
      run:
        working-directory: Backend    # run commands inside the Backend folder

    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # full history, SonarQube uses it to find "new code"

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven                # remember downloaded libraries, so next runs are faster

      - name: Build, test and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # the password from GitHub's locked box
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=vineela162000
          -Dsonar.projectKey=Vineela162000_shopsphere

  # ---------- Job 2: React frontend ----------
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install libraries (exactly as in package-lock.json)
        run: npm ci

      - name: Check code style (ESLint)
        run: npm run lint

      - name: Build the React app
        run: npm run build

  # ---------- Job 3: publish the backend image to Docker Hub ----------
  # Same steps you did by hand: build JAR -> log in -> build image -> push
  publish-backend:
    name: Publish backend image (Docker Hub)
    needs: [backend, frontend]        # only runs if both jobs above passed
    # only after a merge to main, never on a PR (PRs are not reviewed yet)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the JAR (tests already passed in the backend job)
        run: mvn -B package -DskipTests

      - name: Allow building for both Intel and Apple chips
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx (the advanced docker build)
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub (same as "docker login" by hand)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}   # a normal setting, not secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # the token, from GitHub's locked box

      - name: Build and push the image (same as "docker build" + "docker push")
        run: |
          IMAGE=${{ vars.DOCKERHUB_USERNAME }}/shopsphere-backend
          SHA=${GITHUB_SHA::7}                    # short commit id, like 3f2a1bc
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE:$SHA \
            -t $IMAGE:latest \
            --push .
          echo "Pushed $IMAGE:$SHA"